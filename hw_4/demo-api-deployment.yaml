apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  labels:
    app: demo-api
    tier: backend
    lab: hw4
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
      tier: backend
  template:
    metadata:
      labels:
        app: demo-api
        tier: backend
        lab: hw4
        version: v1
    spec:
      # Init контейнер - ждет готовности Redis
      initContainers:
      - name: wait-for-redis
        image: busybox:1.36
        command: ['sh', '-c']
        args:
        - |
          echo "Waiting for Redis to be ready..."
          until nc -z redis-service 6379; do
            echo "Redis is not ready yet..."
            sleep 2
          done
          echo "Redis is ready!"
        env:
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: demo-api-configmap
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: demo-api-configmap
              key: REDIS_PORT

      containers:
      - name: demo-api-container
        image: demo-api:latest
        imagePullPolicy: Never  # Используем локальный образ из minikube
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        
        # Volume для хранения данных
        volumeMounts:
        - name: app-data
          mountPath: /app/data

        # Переменные окружения из ConfigMap и Secret
        envFrom:
        - configMapRef:
            name: demo-api-configmap
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: demo-api-secret
              key: REDIS_PASSWORD

        # Liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        # Readiness probe
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 250m
            memory: 128Mi

      volumes:
      - name: app-data
        emptyDir: {}

      restartPolicy: Always
      dnsPolicy: ClusterFirst

